[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1podium"
version = "2.0.0"
description = "Leak-free Formula 1 podium probability model with a season-by-season backtest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["f1podium[api]", "pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
f1podium = "f1podium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["f1podium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/app", "src/data", "src/data_collection", "src/feature_engineering", "src/modeling"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is left to the formatter
